name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:check
      - run: npm run test
      - run: npm run build

      # The Playwright golden path drives the real API + MongoDB, so it runs in the
      # infra repo's pipeline where the whole stack is brought up with docker compose,
      # rather than here where only the frontend exists.

