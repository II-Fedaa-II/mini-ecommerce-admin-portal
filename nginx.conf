server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths must fall back to index.html rather than 404,
  # otherwise a hard refresh on /cart or /products/:id breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:woff2|css|js|svg|png|jpg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
